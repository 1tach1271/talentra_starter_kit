services:

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: talentra_db
    environment:
      POSTGRES_USER:     talentra
      POSTGRES_PASSWORD: talentra
      POSTGRES_DB:       talentra
    ports:
      - "5433:5432"
    volumes:
      - talentra_data:/var/lib/postgresql/data
      # SQL files available inside container at /talentra_db/
      - ./talentra_db:/talentra_db:ro
      # Only the ordering wrapper goes into initdb.d — runs on first start
      - ./talentra_db/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    command: >
      postgres
        -c shared_buffers=512MB
        -c work_mem=32MB
        -c maintenance_work_mem=512MB
        -c max_wal_size=4GB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=64MB
        -c shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentra -d talentra"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Python seed service ───────────────────────────────────────────────────
  # Runs once after postgres is healthy, then exits.
  # Your friend just needs: docker-compose up
  seed:
    build:
      context: ./seed
      dockerfile: Dockerfile
    container_name: talentra_seed
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST:     db
      DB_PORT:     "5432"
      DB_NAME:     talentra
      DB_USER:     talentra
      DB_PASSWORD: talentra
    restart: "no"   # exit after seeding — do not restart

volumes:
  talentra_data:
    # docker-compose down -v  ← removes this volume and wipes all data
