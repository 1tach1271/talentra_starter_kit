services:
  db:
    image: postgres:16
    container_name: talentra_db
    environment:
      POSTGRES_USER: talentra
      POSTGRES_PASSWORD: talentra
      POSTGRES_DB: talentra
    ports:
      - "5432:5432"
    volumes:
      - talentra_data:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=4GB -c work_mem=64MB
      -c maintenance_work_mem=1GB -c max_wal_size=8GB
      -c shared_preload_libraries=pg_stat_statements
volumes:
  talentra_data:
